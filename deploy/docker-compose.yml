# Local dev only. The prod compose (caddy, worker, ARM64) is added at deployment time.
# The Postgres credentials below are non-secret dev values.
name: cartwise

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cartwise
      POSTGRES_PASSWORD: cartwise
      POSTGRES_DB: cartwise
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartwise -d cartwise"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
      secrets:
        - extra_ca
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://cartwise:cartwise@db:5432/cartwise
      ENV: dev
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  # Scheduled jobs (APScheduler): the api's image and code, another command.
  # The api runs the migrations; the worker starts once it is up.
  worker:
    build:
      context: ../backend
      secrets:
        - extra_ca
    command: ["python", "-m", "app.worker.main"]
    # Back up after a crash, or purge stops silently. init: a real PID 1, so SIGTERM stops it.
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://cartwise:cartwise@db:5432/cartwise
      ENV: dev
      LOG_LEVEL: INFO
      # Ingestion health alerts (Story 3.5). No values here: set them in deploy/.env (not in git)
      # or in the shell. Empty means the default; e-mail is off until every ALERT_* is set.
      INGEST_STALE_HOURS: ${INGEST_STALE_HOURS:-}
      INGEST_RECORD_DROP_PCT: ${INGEST_RECORD_DROP_PCT:-}
      INGEST_FILE_ERROR_PCT: ${INGEST_FILE_ERROR_PCT:-}
      INGEST_ALERT_REPEAT_HOURS: ${INGEST_ALERT_REPEAT_HOURS:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}

volumes:
  db-data:

secrets:
  # Extra CA bundle for the image build only. Defaults to an empty file.
  # On a TLS-intercepting network, set CARTWISE_EXTRA_CA to the full CA bundle path.
  extra_ca:
    file: ${CARTWISE_EXTRA_CA:-./no-extra-ca.crt}
